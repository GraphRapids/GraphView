version: "3.9"

services:
  graphview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6006:6006"
    environment:
      - PORT=6006
    networks:
      - graphview-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:6006/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  graphview-net:
    driver: bridge
