services:
  graphview:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - graphview-net

networks:
  graphview-net:
    driver: bridge
